<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Panadería La Vicky</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <h2>🥖 La Vicky</h2>
            <p>Ingresa tus credenciales para continuar</p>
        </div>
        
        <div id="error-message" class="alert alert-danger" style="display: none;"></div>
        
        <form id="loginForm" action="../backend/api.php?route=login_redirect" method="POST">
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="admin@lavicky.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="******">
            </div>
            
            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        // Mostrar errores desde la URL (enviados por PHP header redirect)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.style.display = 'block';
            const errorType = urlParams.get('error');
            if (errorType === 'credenciales') errorDiv.textContent = 'Correo o contraseña incorrectos.';
            else if (errorType === 'campos_vacios') errorDiv.textContent = 'Por favor, complete todos los campos.';
            else errorDiv.textContent = 'Ocurrió un error al intentar iniciar sesión.';
        }
    </script>
</body>
</html>
